<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>公开网络 · DSH Agent Studio</title><link rel="stylesheet" href="/styles.css"><script src="/network.js" defer></script></head>
<body class="network-page"><main>

<h1>公开网络</h1>

<button class="button primary" id="save" disabled>保存搜索设置</button> <button class="button secondary" id="reload" type="button">重新载入</button></form>
<p id="status" role="status"></p><h2>最近 50 次访问</h2><ol id="calls"></ol>
</main></body></html>
