services:
  studio:
    depends_on:
      public-search:
        condition: service_healthy
    environment:
      STUDIO_BUNDLED_SEARCH: "1"

  public-search:
    image: ${STUDIO_SEARCH_IMAGE:-searxng/searxng:latest}
    pull_policy: ${STUDIO_SEARCH_PULL_POLICY:-missing}
    user: "977:977"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    environment:
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: 8080
      GRANIAN_WORKERS: 1
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
      - /etc/searxng:rw,nosuid,nodev,noexec,uid=977,gid=977,size=1m
      - /var/cache/searxng:rw,nosuid,nodev,noexec,uid=977,gid=977,size=16m
    volumes:
      - ./deploy/public-search.yml:/opt/studio-search.yml:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        secret=$$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')
        sed "s/__GENERATE_AT_START__/$$secret/" /opt/studio-search.yml > /etc/searxng/settings.yml
        exec /usr/local/searxng/entrypoint.sh
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 4
